[project]
name = "face-landmark-onnx"
version = "0.1.0"
readme = "README.md"
license-files = ["THIRD_PARTY_NOTICES.md", "licenses/*"]
description = "One face per image, batched MediaPipe inference on CPU and CUDA"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.1.3", "numba==0.68.0"]

[project.optional-dependencies]
cpu = ["onnxruntime==1.23.2"]
cuda = ["onnxruntime-gpu[cuda,cudnn]==1.23.2", "cupy-cuda12x[ctk]==14.2.0"]

export = [
    "tensorflow==2.19.1",
    "tf2onnx==1.17.0",
    "onnx==1.19.1",
    "onnxscript==0.7.2",
]

[project.scripts]
face-landmarker-export = "face_landmarker_export:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pillow>=11,<13"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["face_landmarker", "face_landmarker_export"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]
default-groups = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: requires exported models in models/",
    "cuda: requires CUDAExecutionProvider and a CUDA device",
]
